name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: vpn_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vpn_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm run build
      - name: Dependency audit (prod, non-blocking)
        run: pnpm audit --prod --audit-level high || true
      - name: Secret scan (простые шаблоны)
        run: |
          if git grep -nE '(vp_[A-Za-z0-9_-]{40,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' -- . ':!*.test.ts' ':!pnpm-lock.yaml'; then echo 'Похоже на секрет в репозитории'; exit 1; fi
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh
